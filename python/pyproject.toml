[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "replaylab"
version = "0.1.0"
requires-python = ">=3.11"
description = "Independent reference and experiment tools for ReplayLab"
[tool.setuptools.packages.find]
where = ["."]
include = ["replaylab_ref*", "replaylab_tools*"]
